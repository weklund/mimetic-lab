name: Judge Tests

on:
  pull_request:
    paths:
      - 'eval/**'
      - '.github/workflows/judge-tests.yml'
  push:
    branches:
      - main
    paths:
      - 'eval/**'
      - '.github/workflows/judge-tests.yml'
  workflow_dispatch:

jobs:
  test:
    name: Judge tests
    runs-on: ubuntu-latest
    env:
      BLACK_SHA: 89e7bbb57db62e3c830a8ca672a0805080df3970
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'

      # networkx: the official Table 10 model imports it (black_reference.load_table10).
      - name: Install numpy and networkx
        run: python -m pip install numpy networkx

      # Black's code is read at the pinned SHA, never copied into this repo.
      # black_reference.py also checks the SHA-256 of the two files it reads.
      - name: Check out Black's simulation at the pinned SHA
        run: |
          git clone --quiet https://github.com/maxwell-black/mimetic-desire-simulation.git eval/.cache/mimetic-desire-simulation
          git -C eval/.cache/mimetic-desire-simulation checkout --quiet "$BLACK_SHA"

      - name: Run tests
        env:
          REQUIRE_OFFICIAL: '1'
        run: python -W error::ResourceWarning -m unittest discover -s eval/judge -p 'test_*.py' -v
