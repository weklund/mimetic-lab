  - id: S1
    title: Convergence of Desire (Sack Theorem 1), first Lean target
    priority: P0
    milestone: M2-sack-lean
    kind: theorem
    stands_in_for: G1
    statement: >
      Let N be a finite set, med : N -> N and obj : N -> N. Say (med, obj) is in
      equilibrium if obj (med i) = obj i for every i. Then in equilibrium, any two
      nodes in the same weakly connected component of the mediation graph
      (equivalently, related by the equivalence closure of i ~ med i) have the
      same object.
    source:
      - "Sack, Geometries of Desire, in Yang and von Briesen (eds), Proc. 2020 CSSSA, Springer 2021, pp. 217-243, doi 10.1007/978-3-030-83418-0_13, Appendix, Definitions 1-4 and Theorem 1."
    locator: complete (appendix opened on Springer)
    assumptions:
      - Exactly one out mediation link and one out object link per node (Def 1).
      - Static equilibrium; nothing about dynamics.
    counterexample: >
      Formally none if the proof checks. A definitional failure is possible: Def 4
      ('cannot be partitioned into non-empty disjoint mutual mediator sets') is
      satisfied both by a whole weak component and by its mediation cycle alone.
      The theorem holds under either reading, so formalize via weak components and
      note the ambiguity.
    why_first: >
      Smallest dependency surface: a functional graph, an equivalence closure, and
      induction on the closure. The proof is two lines once the relation is set up,
      so effort goes into getting definitions right, which every later Sack theorem
      reuses (S2, S3, S4 all cite Theorem 1).
    formalization_delta: >
      Drops distance, rivalry, intensity, plural models, and time. 'Equilibrium' is
      a fixed point, not an attractor; the theorem does not say any dynamics reach
      it. Sack's own 3-agent run cycles with period 14 and never reaches
      equilibrium (notes 5-6). The abstract's 'tendency for all agents to converge
      on a single, universal object' is a simulation observation, not Theorem 1.
    lean:
      file: "lean/SackTheorem/MimeticNetwork.lean, PR #2 merge d67b670"
      theorems:
        - "convergence_on_weak_component: this statement, on weak components (equivalence closure of i ~ med i). No axioms."
        - "convergence_of_desire: Sack's form, on minimum mutual mediator sets."
      check: "lean/SackTheorem/AxiomAudit.lean pins both theorems' axioms; CI fails on sorryAx."
    status: proved-in-lean

  - id: S2
    title: Non-Identity of Desire (Sack Theorem 2)
    priority: P1
    milestone: M2-sack-lean
    kind: theorem
    statement: >
      If no node desires itself (obj i != i for every i), then in equilibrium
      every node of a minimum mutual mediator set desires a node outside that set.
    source: ["Sack 2021, Appendix, Theorem 2."]
    assumptions: As S1, plus no object self-links (no node desires itself).
    counterexample: Formal only.
    lean:
      file: "lean/SackTheorem/MimeticNetwork.lean, PR #2 merge d67b670"
      theorems: ["non_identity_of_desire: this statement, on minimum mutual mediator sets (Sack's form)."]
      note: "This is the form that is proved. A weak-component wording would need the same lemma that keeps S4 at stated, and is not claimed here."
    status: proved-in-lean

  - id: S3
    title: Equilibrium without narcissism exists iff at least two components (Sack Theorem 3)
    priority: P1
    milestone: M2-sack-lean
    kind: theorem
    statement: Without self-links, an equilibrium (obj) exists for a given med if and only if the mediation graph has at least two weak components.
    source: ["Sack 2021, Appendix, Theorem 3."]
    assumptions:
      - "Needs a nonempty node set: for empty N the only-if fails, because the hypotheses hold vacuously and there are not two weak components."
    lean:
      file: "lean/SackTheorem/MimeticNetwork.lean, PR #11 merge 30b330e"
      theorems:
        - "existence_equilibrium_no_narcissism_if_weak_components (proved, PR #11): the claim statement's 'if'. If the mediation graph has at least two weak components, an equilibrium with no self-desire exists. Uses two_weak_components_yield_partition, then existence_equilibrium_no_narcissism_if."
        - "unique_narcissist_of_weakly_connected (proved, the lab's reading): a weakly connected network in equilibrium has exactly one self-desiring node, which every node desires. The contrapositive, with a nonempty node set, is the claim statement's 'only if'."
        - "existence_equilibrium_no_narcissism_if (proved, PR #11): Sack's construction. Given a partition into at least two nonempty, disjoint, med-closed sets, constructs an object assignment with equilibrium and no self-desire."
        - "existence_equilibrium_no_narcissism_only_if (proved, PR #9): Sack's wording. If no node desires itself and the network is in equilibrium, the nodes split into at least two nonempty, disjoint mutual mediator sets. Needs a nonempty node set."
        - "existence_equilibrium_no_narcissism_only_if_minimum: still proof_wanted. Needs the lemma that every weak component is a minimum mutual mediator set. Not required for this claim's weak-component statement."
      check: "lean/SackTheorem/AxiomAudit.lean pins the axioms; CI fails on sorryAx. The 'if' theorems, the partition lemma, and the MMS only-if all pin propext, Classical.choice, and Quot.sound. unique_narcissist_of_weakly_connected pins no axioms."
      note: "Both directions of this claim's iff on weak components are proved. This is a theorem about Sack's graph model, not about Girard."
    status: proved-in-lean

  - id: S4
    title: Objects of desire bounded by components (Sack Theorem 5)
    priority: P1
    milestone: M2-sack-lean
    kind: theorem
    statement: In equilibrium, the number of distinct objects is at most the number of weak components of the mediation graph.
    source: ["Sack 2021, Appendix, Theorem 5."]
    lean:
      file: "lean/SackTheorem/MimeticNetwork.lean, PR #2 merge d67b670"
      theorems: ["number_of_objects_bound (proved): at most the number of parts in any cover of the nodes by minimum mutual mediator sets."]
      gap: "This statement's weak-component form also needs the lemma that every weak component is a minimum mutual mediator set (not yet proved)."
    status: stated

  - id: S5
    title: Sack dynamics reach equilibrium
    priority: P2
    milestone: later
