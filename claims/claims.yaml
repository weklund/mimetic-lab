  - id: O1
    title: Paes accusation rules reduce tension at low cost
    priority: P2
    milestone: later
    kind: model
    statement: In Paes's coevolving-network ABM, removing the accusation rules lets tension saturate and kills most agents; with them tension stays low and cost falls on a few. Closure decides whether expulsion occurs; skepticism decides when.
    source: ["Paes, 'An agent-based model of scapegoating', CoMSES 1.0.1 (pub. 2025-08-28, modified 2026-11-08); description mentions a 1.1.0 package for a JASSS submission. github.com/carlospaes120/scapegoat returned 404 on 2026-11-11."]
    formalization_delta: Victim selection and the 10% marking threshold are programmed, so this tests consequences of scapegoating, not its emergence.
    status: reported-by-source

  - id: O2
    title: Imitation rules are themselves imitated (Chavalarias)
    priority: P2
    milestone: later
    kind: model
    statement: In metamimetic games, agents carry bounded chains of imitation rules that are themselves modifiable; equilibrium is a 'counterfactually stable state' and dynamics are not in general reducible to replicator dynamics.
    source: ["Chavalarias, 'Metamimetic Games', JASSS 9(2) 5, 2006 (arXiv nlin/0508006), s4.1-4.3."]
    formalization_delta: General imitation framework; no objects of desire, rivalry, or scapegoat in the sections opened.
    status: reported-by-source

  - id: O3
    title: Homophilic mimesis ends in disjoint cliques (Rodriguez Caballero)
    priority: P2
    milestone: later
    kind: theorem
    statement: Under psi' = -C L[G_eps(psi)] psi with G_eps linking agents whose traits differ by at most eps, the network eventually freezes into a union of complete graphs.
    source: ["Rodriguez Caballero, 'Homophilic networks evolving by mimesis', arXiv 2008.05894 (2020), Theorem 1."]
    review_flags:
      - "Eq. (10) in the proof writes the decay from t_0 where Lemma 2 gives it from the interval start t_k. This looks like a gap. A later Lean target, not M2."
    formalization_delta: Mimesis becomes linear diffusion of one scalar trait. Drops objects, rivalry, mediators. Cites Girard only for motivation.
    status: reported-by-source

