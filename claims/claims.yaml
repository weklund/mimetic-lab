  - id: O5
    title: Majority imitation on binary labels converges to a fixed point or a 2-cycle
    priority: P1
    milestone: later
    kind: theorem
    statement: >
      On a finite undirected graph with binary labels (each vertex holds a
      value in {0,1} or in {+1,-1}), under synchronous update in which each
      agent adopts the bit held by a strict majority of its neighbors and
      keeps its own on a tie, every trajectory eventually reaches a fixed
      point or a cycle of length 2.
    source:
      - "Goles and Olivos, 'Periodic behaviour of generalized threshold functions,' Discrete Mathematics 30(2) (1980) 187-189, DOI 10.1016/0012-365X(80)90121-1. Bibliographic record opened (Crossref: title, authors, journal, volume, issue, pages). Full PDF and abstract not opened. Locator: article page range only; no theorem number."
      - "Restatement opened: Goles and Ruz, 'Dynamics of neural networks over undirected graphs,' Neural Networks 63 (2015) 156-169, DOI 10.1016/j.neunet.2014.10.013, pp. 156-157: parallel (synchronous) update on a symmetric neural network converges to a fixed point or a cycle of period 2, citing Goles and Olivos (1980). Full PDF opened. Corollary 2.1 and Theorem 3.1 of that paper are other results (nonnegative-definite matrices, and the alpha(G) criterion) and are not this claim."
      - "Moran, 'On the period-two-property of the majority operator in infinite graphs,' Trans. AMS 347 (1995) 1649-1667, DOI 10.1090/S0002-9947-1995-1297535-1. Crossref abstract opened: the operator labels each vertex by the majority bit of its neighbors and retains the vertex's own label on a tie. The abstract treats locally finite graphs, including infinite ones, and does not, in the text opened, attribute the finite-graph case to Goles-Olivos or Poljak and Sůra. Full PDF not opened (publisher 403)."
      - "Related primary, record only: Poljak and Sůra, 'On periodical behaviour in societies with symmetric influences,' Combinatorica 3(1) (1983) 119-121, DOI 10.1007/BF02579347. Bibliographic record opened (Crossref). Full PDF and abstract not opened. No theorem statement or tie rule is taken from this paper."
    assumptions:
      - "Labels are binary: each vertex holds a value in {0,1} or in {+1,-1}."
      - "Synchronous deterministic update; each agent takes a strict majority of neighbors and keeps its own on a tie."
      - "The graph is finite, undirected, and fixed (no growth or rewiring)."
      - "A different tie-breaking rule, a plurality rule, or a multi-valued label set is a different model; period at most 2 is not claimed for those from the opened sources."
    formalization_delta: >
      Relative to G4: discrete binary labels, not continuous hostility.
      Deterministic synchronous update, not a recruitment process whose
      pull multiplies with the number already polarized. No objects and
      no acquisitive rivalry stage; agents copy labels directly. No
      scapegoat-specific mechanism. This claim is only the period bound
      for the binary rule, not G4's inevitable unanimity (see O6). The
      multi-valued or vertex-target case is not part of this
      reported-by-source claim.
    stands_in_for: G4
    status: reported-by-source
    review_flags:
      - "The 1980 Goles-Olivos PDF was not opened; the period-2 statement used here is the 2015 Goles-Ruz restatement, plus the bibliographic record of the 1980 article. Do not add a 1980 theorem number until that PDF is read. Whether the 1980 statement restricts the diagonal is unchecked."
      - "The 1983 Poljak and Sůra PDF and abstract were not opened. Do not cite that paper for a plurality or tie rule."
      - "The opened sources for the period-2 statement (Goles-Ruz 2015 pp. 156-157, Moran 1995 abstract) are binary or threshold. The multi-valued case is not taken from an opened source; Poljak and Sůra, the usual citation for that case, was not opened. Vertex-target examples belong on O6, which is stated from direct inspection."
    counterexample: >
      A trajectory under this exact binary rule (strict majority, keep own
      on a tie) with period greater than 2.

  - id: O6
    title: Majority imitation can stay split
    priority: P1
    milestone: later
    kind: model
    statement: >
      Under synchronous strict majority of neighbors, keep own on a tie,
      unanimity is not inevitable. Two binary configurations that are split
      fixed points under the O5 rule, checked by direct inspection: (1) the
      4-vertex path with labels (0,0,1,1); (2) two triangles {0,1,2} and
      {3,4,5} joined by the edge 2-3, with labels (0,0,0,1,1,1). The same
      two-triangle graph with vertex targets (5,5,5,0,0,0), under the same
      majority rule extended to vertex-valued labels, is a fixed point that
      is not a single-victim state: each faction targets a member of the
      other.
    source:
      - "The two binary configurations use the O5 update rule. The vertex-target configuration uses that majority rule on vertex-valued labels, stated from the model's definition, not from an opened source for a period bound. The three configurations were checked by direct inspection of one step of the relevant rule, not taken from a published table. Lean issue #15 is to confirm the two-triangle examples by decide and to prove a general period bound for the binary rule."
    assumptions:
      - "For the two binary examples: the O5 rule (binary labels, synchronous strict majority of neighbors, keep own on a tie)."
      - "For the vertex-target example: the same majority rule on vertex-valued labels, with no self-targeting. Each agent adopts the target held by a strict majority of its neighbors and keeps its own on a tie. This multi-label rule is stated from the model's definition, not taken from an opened source."
    formalization_delta: >
      Relative to G4: same drops as O5 (discrete targets, deterministic
      majority, no objects or rivalry, no multiplying attraction). This
      reading therefore does not support G4's 'inevitable' unification
      against a single individual. If self-targeting is forbidden, not every
      agent can target the same victim, so the unanimity test used here is
      ordinary agreement (all agents holding the same label), and the
      examples still fail it. A Lean proof of these examples upgrades only
      this claim, never G4.
    stands_in_for: G4
    status: stated
    counterexample: >
      A proof that one of the named configurations is not a fixed point
      under the rule stated for it, or a theorem that every trajectory
      under that rule reaches unanimity.

  - id: O7
    title: Voter-model unanimity depends on the update schedule
    priority: P1
    milestone: later
    kind: theorem
    statement: >
      In the voter model on a finite connected graph (each agent copies a
      random neighbor's opinion), almost-sure unanimity is a claim about a
      specified schedule. In continuous time, Aldous and Fill state that a
      unique consensus opinion appears at a finite random time on a finite
      regular graph, and that the structural results extend to general
      graphs. For discrete-time synchronous update, published work assumes
      the graph is not bipartite, or that the walk is lazy (an agent may
      keep its own opinion with probability 1/2). The almost-sure claim is
      not made here for synchronous update on a bipartite graph.
    source:
      - "Aldous and Fill, Reversible Markov Chains and Random Walks on Graphs, section 14.3 (March 10, 1994 text), opened at https://www.stat.berkeley.edu/~aldous/RWG/Book_Ralph/Ch14.S3.html. They define the continuous-time voter model on a finite regular graph and state that at some random time C_vm there will be only one consensus opinion. Proposition 14.9 is a bound on the expected consensus time, not the almost-sure claim itself. The opened section contains no Donnelly-Welsh citation."
      - "Cooper, Elsasser, Ono, and Radzik, arXiv 1204.4106v3 (25 Dec 2016), full preprint opened. Pages 3-4: they assume the graph is not bipartite, or that the random walks are lazy and pause with probability 1/2 (equivalently, a voter may choose its own opinion with that probability). The abstract notes lack of coalescence on bipartite graphs as a reason for the lazy assumption. Via Cooper, Hassin and Peleg are cited for an O(n^3 log n) expected completion time on any connected graph; that paper itself was not opened. The SIAM Journal on Discrete Mathematics 27 (2013) pagination was not opened separately."
      - "Clifford and Sudbury, 'A model for spatial conflict,' Biometrika 60(3) (1973) 581-588, DOI 10.1093/biomet/60.3.581. Bibliographic record opened (Crossref). Full PDF and abstract not opened. Locator: article page range only."
      - "Holley and Liggett, 'Ergodic Theorems for Weakly Interacting Infinite Systems and the Voter Model,' Ann. Probab. 3(4) (1975) 643-663, DOI 10.1214/aop/1176996306. Bibliographic record and Crossref abstract opened. Full PDF not opened. The work is infinite-system theory; no finite-graph theorem is taken from it."
      - "Donnelly and Welsh, 'Finite particle systems and infection models,' Math. Proc. Camb. Phil. Soc. 94 (1983) 167-182, DOI 10.1017/S0305004100060989. Bibliographic record opened (Crossref). Full PDF and abstract not opened. Locator: article page range only; no theorem number."
    assumptions:
      - "The graph is finite and connected, and is fixed."
      - "The schedule must be named: continuous-time, asynchronous, or lazy (or synchronous on a non-bipartite graph). Synchronous update on a bipartite graph is excluded from the almost-sure claim."
    formalization_delta: >
      Relative to G4: discrete opinions, not continuous hostility. Adoption
      is a random copy of a neighbor, so it is linear in the current count,
      not a pull that multiplies with the number already polarized. No
      objects, no rivalry stage, and no scapegoat-specific mechanism. Fixed
      finite undirected graph, no growth or rewiring. Almost-sure unanimity,
      where it holds, is a fact about this Markov chain, not a reading of
      G4's 'inevitable' unification, and a pass never upgrades G4.
    stands_in_for: G4
    status: reported-by-source
    review_flags:
      - "The almost-sure finite-graph theorem is not given a theorem number from Donnelly and Welsh; that PDF was not opened. Proposition 14.9 of Aldous and Fill is not to be cited as that theorem."
      - "Absorption probabilities equal to the degree-weighted initial share are not recorded here; no primary for that identity was opened."
    counterexample: >
      A continuous-time or lazy voter process on a finite connected graph
      that, with positive probability, never reaches a single opinion; or a
      sourced theorem that synchronous voter update on a connected bipartite
      graph reaches unanimity almost surely.

  - id: W1
    title: Anti-mimesis converges on the rival (Wes, hypothesis)
